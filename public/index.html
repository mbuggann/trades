<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRISMA Live Monitor</title>

<style>
:root {
  --bg:#0b0c10;
  --panel:#14161c;
  --line:#242a35;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --green:#22c55e;
  --red:#ef4444;
  --blue:#38bdf8;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui;
}
.wrap {
  max-width:900px;
  margin:auto;
  padding:20px;
}
.card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
}
button {
  background:var(--panel);
  border:1px solid var(--line);
  color:white;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}
.toast {
  position:fixed;
  right:20px;
  top:20px;
  background:#1b1f27;
  padding:12px;
  border-radius:10px;
}
</style>
</head>

<body>
<div class="wrap">

<h1>PRISMA Live Monitor</h1>

<div class="card">
  <button id="notifyBtn">Enable Notifications</button>
</div>

<div id="list"></div>

</div>

<div id="toasts"></div>

<script>
let trades = [];
let knownIds = new Set();
let initialLoad = false;

const API_URL = '/api/prisma/trades';
const VAPID_PUBLIC_KEY = 'PASTE_YOUR_PUBLIC_KEY_HERE';

function toast(text) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerText = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),4000);

  if (Notification.permission === 'granted') {
    new Notification(text);
  }
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = trades.map(t => `
    <div class="card">
      <b>${t.symbol}</b> ${t.option_type} ${t.strike}<br>
      Entry: ${t.entry_price}
    </div>
  `).join('');
}

async function fetchTrades() {
  const res = await fetch(API_URL);
  const data = await res.json();
  return Array.isArray(data) ? data : data.trades;
}

async function poll() {
  try {
    const newTrades = await fetchTrades();
    const newIds = new Set(newTrades.map(t => t.trade_id));

    if (!initialLoad) {
      trades = newTrades;
      knownIds = newIds;
      initialLoad = true;
      render();
      return;
    }

    newTrades.forEach(t => {
      if (!knownIds.has(t.trade_id)) {
        toast(`New trade: ${t.symbol}`);
      }
    });

    trades = newTrades;
    knownIds = newIds;
    render();

  } catch (e) {
    console.log(e);
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function subscribe() {
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return alert('Denied');

  const reg = await navigator.serviceWorker.ready;

  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }

  await fetch('/api/push/subscribe', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({subscription:sub})
  });

  alert('Subscribed!');
}

document.getElementById('notifyBtn').onclick = subscribe;

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

poll();
setInterval(poll, 10000);
</script>

</body>
</html>
